<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Player Screen · Dungeon Master's Forge</title>
<style>
  /* The TV screen. It only ever shows pictures the DM's window sends; it has no map data of its own. */
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:default}
  #tv{position:fixed;inset:0;width:100%;height:100%;display:block}
  #wait{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#c9b48a;font-family:Cinzel,Georgia,serif;text-align:center;pointer-events:none}
  #wait h1{margin:0;font-size:clamp(22px,4vw,44px);font-weight:700;letter-spacing:.04em}
  #wait p{margin:0;font-family:'Crimson Pro',Georgia,serif;font-style:italic;font-size:clamp(14px,1.6vw,20px);color:#8c7a5a}
  #wait[hidden]{display:none}
  #hint{position:fixed;right:12px;bottom:10px;font:13px Georgia,serif;color:#5d5243;opacity:.8;transition:opacity 1s}
  body.idle #hint{opacity:0}
</style>
</head>
<body>
<canvas id="tv"></canvas>
<div id="wait"><h1>Waiting for the DM…</h1><p>The map appears here when the DM shares it.</p></div>
<div id="hint">Double-click for full screen</div>
<script>
(() => {
  const cv = document.getElementById("tv"), g = cv.getContext("2d"), wait = document.getElementById("wait");
  const ch = new BroadcastChannel("dmforge.map"), up = new BroadcastChannel("dmforge.map.tv"); // DM → TV pictures; TV → DM hello/bye
  let img = null, pings = [];
  window.tvFrames = 0; // pictures shown so far (used by the automated checks)
  window.tvRect = null; // where the map picture sits on screen (used by the automated checks)

  function draw() {
    const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = "#000"; g.fillRect(0, 0, cv.width, cv.height);
    if (!img) { window.tvRect = null; return; }
    const s = Math.min(cv.width / img.width, cv.height / img.height), w = img.width * s, h = img.height * s;
    const R = { x: (cv.width - w) / 2, y: (cv.height - h) / 2, w, h };
    g.imageSmoothingQuality = "high"; g.drawImage(img, R.x, R.y, w, h); window.tvRect = R;
    const now = performance.now();
    pings = pings.filter(p => now - p.t < 1200);
    pings.forEach(p => {
      const k = (now - p.t) / 1200, X = R.x + p.x * R.w, Y = R.y + p.y * R.h;
      g.strokeStyle = `rgba(245,187,99,${1 - k})`; g.lineWidth = 4 * dpr;
      for (const off of [0, .35]) { const r = Math.max(0, (k - off)) * 70 * dpr; if (r > 0) { g.beginPath(); g.arc(X, Y, r, 0, Math.PI * 2); g.stroke(); } }
    });
    if (pings.length) requestAnimationFrame(draw);
  }

  ch.onmessage = async e => {
    const m = e.data || {};
    if (m.t === "frame" && m.blob instanceof Blob) {
      try { const bmp = await createImageBitmap(m.blob); if (img && img.close) img.close(); img = bmp; wait.hidden = true; draw(); window.tvFrames++; } catch (err) { /* ignore a broken frame */ }
    } else if (m.t === "ping" && img) {
      pings.push({ x: +m.x || 0, y: +m.y || 0, t: performance.now() }); requestAnimationFrame(draw);
    } else if (m.t === "bye") {
      img = null; wait.hidden = false; draw();
    }
  };
  addEventListener("resize", draw);
  addEventListener("dblclick", () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); });
  let idle; addEventListener("mousemove", () => { document.body.classList.remove("idle"); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add("idle"), 2500); });
  idle = setTimeout(() => document.body.classList.add("idle"), 4000);
  addEventListener("pagehide", () => up.postMessage({ t: "bye" }));
  draw();
  up.postMessage({ t: "hello" });
})();
</script>
</body>
</html>
