[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The app is one page; API calls go to the function at /api/*.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# The service worker must always be checked for updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The PDF reader (pdf.js) is loaded as a JavaScript module, which browsers only accept with a JavaScript content type.
[[headers]]
  for = "/vendor/pdfjs/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
